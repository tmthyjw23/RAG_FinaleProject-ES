<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Expert Chatbot</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f4f7f6;
            --chat-bg: #ffffff;
            --user-msg: #dcf8c6;
            --bot-msg: #f1f0f0;
            --text-color: #333;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 300px; background: #2c3e50; color: white; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid #5d6d7e; padding-bottom: 10px; }
        .upload-section { display: flex; flex-direction: column; gap: 10px; }
        input[type="file"] { color: white; font-size: 0.8rem; }
        button { cursor: pointer; padding: 10px; border: none; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-danger { background: #e74c3c; color: white; margin-top: auto; }
        button:hover { opacity: 0.8; }

        /* Chat Area */
        .chat-container { flex: 1; display: flex; flex-direction: column; }
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 70%; padding: 12px 16px; border-radius: 15px; line-height: 1.5; position: relative; }
        .user { align-self: flex-end; background: var(--user-msg); border-bottom-right-radius: 2px; }
        .bot { align-self: flex-start; background: var(--bot-msg); border-bottom-left-radius: 2px; }

        /* Input Area */
        .input-area { padding: 20px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>⚙️ Pengaturan</h2>
        <div class="upload-section">
            <label>Upload PDF Dokumen:</label>
            <input type="file" id="pdfFile" accept="application/pdf">
            <button class="btn-primary" onclick="uploadFile()">Proses Dokumen</button>
        </div>
        <button class="btn-danger" onclick="resetDB()">Reset Database</button>
    </div>

    <div class="chat-container">
        <div id="chat-window">
            <div class="message bot">Halo! Silakan upload PDF di sidebar, lalu tanyakan apa saja tentang dokumen tersebut. 🤖</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Tulis pertanyaan Anda..." onkeypress="handleEnter(event)">
            <button class="btn-primary" onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('pdfFile');
            if (!fileInput.files[0]) return alert("Pilih file PDF dulu!");

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            appendMessage('bot', 'Sedang memproses dokumen, mohon tunggu...');
            const res = await fetch('/upload', { method: 'POST', body: formData });
            const data = await res.json();
            appendMessage('bot', data.message);
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';

            const res = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ query: text })
            });
            const data = await res.json();
            appendMessage('bot', data.answer);
        }

        async function resetDB() {
            if(!confirm("Hapus semua memori dokumen?")) return;
            const res = await fetch('/reset', { method: 'POST' });
            const data = await res.json();
            alert(data.message);
            location.reload();
        }

        function appendMessage(role, text) {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerText = text;
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        }

        function handleEnter(e) { if(e.key === 'Enter') sendMessage(); }
    </script>
</body>
</html>
